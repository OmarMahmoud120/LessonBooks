# Generated by npm run agents:sync. Shared source: .agents/.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false

[features]
hooks = true

[[hooks.PreToolUse]]
matcher = ".*"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "node \"$(git rev-parse --show-toplevel)/backend/scripts/agent-hook.mjs\" codex"
timeout = 65

[[hooks.PostToolUse]]
matcher = "Edit|Write|apply_patch"
[[hooks.PostToolUse.hooks]]
type = "command"
command = "node \"$(git rev-parse --show-toplevel)/backend/scripts/agent-hook.mjs\" codex"
timeout = 65

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "node \"$(git rev-parse --show-toplevel)/backend/scripts/agent-hook.mjs\" codex"
timeout = 130

[agents.schema_guardian]
description = "Review lesson and event schema compatibility and versioning."
config_file = "agents/schema-guardian.toml"

[agents.privacy_reviewer]
description = "Read-only review of family data, consent, tracking and deletion."
config_file = "agents/privacy-reviewer.toml"

[agents.security_reviewer]
description = "Read-only review of authorization, uploads, model routing and WebView boundaries."
config_file = "agents/security-reviewer.toml"

[agents.a11y_rtl_reviewer]
description = "Review lesson player keyboard access, semantics and RTL behavior."
config_file = "agents/a11y-rtl-reviewer.toml"

[agents.pedagogy_reviewer]
description = "Review synthetic sample lessons for curriculum fit and answer correctness."
config_file = "agents/pedagogy-reviewer.toml"

[agents.test_writer]
description = "Write and run meaningful tests for a specified code change."
config_file = "agents/test-writer.toml"

[agents.doc_keeper]
description = "Keep specifications, ADRs and milestones aligned with implementation."
config_file = "agents/doc-keeper.toml"
