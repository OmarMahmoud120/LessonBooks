# Cloud Run service template for the LessonBooks OCR/generation worker. It receives
# Cloud Tasks OIDC calls on /v1/internal/jobs and must not accept parent tokens.
# Deployment stays blocked by backend/scripts/deploy-gate.mjs pending decisions.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: lessonbooks-worker
  annotations:
    run.googleapis.com/ingress: internal
  labels:
    app: lessonbooks
spec:
  template:
    metadata:
      annotations:
        # REGION is an explicit data-residency decision; keep API and worker co-located.
        run.googleapis.com/region: REGION
        run.googleapis.com/service-account: WORKER_SA@PROJECT_ID.iam.gserviceaccount.com
        autoscaling.knative.dev/minScale: '0'
        # OCR and ClamAV need more memory than the API; bounded on purpose.
        run.googleapis.com/memory: 1536Mi
        run.googleapis.com/cpu: '1'
    spec:
      serviceAccountName: WORKER_SA@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: IMAGE_WORKER
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: CLOUD_RUNTIME_APPROVED
              value: 'true'
            - name: SERVICE_ROLE
              value: worker
            - name: HOST
              value: 0.0.0.0
            - name: REQUIRE_SCAN
              value: 'true'
            - name: FIREBASE_PROJECT_ID
              value: PROJECT_ID
            - name: GCLOUD_REGION
              value: REGION
          resources:
            limits:
              cpu: '1'
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /health
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
            periodSeconds: 10
  traffic:
    - percent: 100
      latestRevision: true
