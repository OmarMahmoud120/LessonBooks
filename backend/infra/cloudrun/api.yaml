# Cloud Run service template for the LessonBooks API. Deployment stays blocked by
# backend/scripts/deploy-gate.mjs until project, region/residency, retention, consent,
# budget and live-provider decisions are recorded. Replace the ALL-CAPS placeholders.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: lessonbooks-api
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
  labels:
    app: lessonbooks
spec:
  template:
    metadata:
      annotations:
        # REGION is an explicit data-residency decision; keep API and worker co-located.
        run.googleapis.com/region: REGION
        # sa annotation requires the least-privilege API service account to exist first.
        run.googleapis.com/service-account: API_SA@PROJECT_ID.iam.gserviceaccount.com
        autoscaling.knative.dev/minScale: '1'
    spec:
      serviceAccountName: API_SA@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: IMAGE_API
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: CLOUD_RUNTIME_APPROVED
              value: 'true'
            - name: SERVICE_ROLE
              value: api
            - name: HOST
              value: 0.0.0.0
            - name: FIREBASE_PROJECT_ID
              value: PROJECT_ID
            - name: GCLOUD_REGION
              value: REGION
            - name: CLOUD_TASKS_LOCATION
              value: REGION
            - name: CLOUD_TASKS_QUEUE
              value: lesson-generation
            - name: WORKER_URL
              value: WORKER_URL
            - name: WORKER_SERVICE_ACCOUNT
              value: WORKER_SA@PROJECT_ID.iam.gserviceaccount.com
          resources:
            limits:
              cpu: '1'
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /health
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
            periodSeconds: 10
  traffic:
    - percent: 100
      latestRevision: true
