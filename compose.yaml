name: lessonbooks
x-runtime: &runtime
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  cpus: 1.0
  mem_limit: 768m
  tmpfs:
    - /tmp:size=256m,mode=1777
  networks: [private]
  stop_grace_period: 30s
services:
  # Local S3-compatible store. Synthetic credentials are local-only; a VPS
  # deployment must generate and inject its own secrets. No public bucket access.
  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    cpus: 1.0
    mem_limit: 512m
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:-GK0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET:-lessonbooks}
      RUST_LOG: garage=warn
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    volumes:
      - garage-data:/data
      - ./backend/infra/garage.toml:/etc/garage.toml:ro
    ports:
      - '127.0.0.1:3900:3900'
    networks: [private, local]
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  # Local identity provider. PostgreSQL and the bootstrap admin use synthetic
  # local-only values; a VPS deployment must inject its own secrets.
  keycloak-db:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    init: true
    # The official entrypoint drops from root to the postgres user and fixes
    # ownership of the data volume, so those capabilities are required.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-local-only-keycloak-db-password}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak -d keycloak']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  keycloak:
    image: quay.io/keycloak/keycloak:26.0@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
    init: true
    # `start` auto-builds an optimized server inside /opt/keycloak on every boot,
    # so this local service cannot use a read-only root. A VPS deployment should
    # bake `kc.sh build` into the image and run it with `--optimized` instead.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    cpus: 2.0
    mem_limit: 1536m
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /opt/keycloak/data/tmp:size=128m,mode=1777
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-local-only-keycloak-db-password}
      # Browsers use the loopback hostname; tokens issued here carry that issuer.
      # The API fetches JWKS from the internal service URL instead.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_PORT: '8080'
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'false'
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-only-keycloak-admin}
      KC_SPI_EVENTS_LISTENER_JBOSS_LOGGING__LEVEL: warn
    command: ['start', '--import-realm', '--log-level=warn']
    volumes:
      - ./backend/infra/keycloak/realm-lessonbooks.json:/opt/keycloak/data/import/realm-lessonbooks.json:ro
    ports:
      - '127.0.0.1:8081:8080'
    networks: [private, local]
    depends_on:
      keycloak-db: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "{ printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.[01] 200'; } 0<>/dev/tcp/127.0.0.1/9000",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
  emulators:
    build: { context: ., dockerfile: backend/Dockerfile, target: emulators }
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    pids_limit: 256
    volumes: [emulator-data:/data]
    ports:
      - '127.0.0.1:9099:9099'
      - '127.0.0.1:8080:8080'
      - '127.0.0.1:9199:9199'
    networks: [private, local]
    stop_grace_period: 60s
  signatures:
    build: { context: ., dockerfile: backend/Dockerfile, target: worker }
    entrypoint: [freshclam, --config-file=/app/freshclam.conf, --stdout]
    volumes: [scanner-data:/var/lib/clamav]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    networks: [updates]
    restart: 'no'
  api:
    <<: *runtime
    build: { context: ., dockerfile: backend/Dockerfile, target: api }
    environment: &local-env
      NODE_ENV: development
      HOST: 0.0.0.0
      FIREBASE_AUTH_EMULATOR_HOST: emulators:9099
      FIRESTORE_EMULATOR_HOST: emulators:8080
      FIREBASE_STORAGE_EMULATOR_HOST: emulators:9199
      ASSET_STORE: s3
      S3_ENDPOINT: http://garage:3900
      S3_BUCKET: ${GARAGE_DEFAULT_BUCKET:-lessonbooks}
      S3_REGION: garage
      S3_ACCESS_KEY_ID: ${GARAGE_DEFAULT_ACCESS_KEY:-GK0123456789abcdef0123456789abcdef}
      S3_SECRET_ACCESS_KEY: ${GARAGE_DEFAULT_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      AUTH_PROVIDER: keycloak
      # Local-only rate-limit bump for browser-test repeatability; the documented
      # 5/hour defaults still apply wherever these variables are unset (VPS).
      RATE_LIMIT_PIN_PER_HOUR: '50'
      RATE_LIMIT_UPLOADS_PER_HOUR: '50'
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:8081}/realms/lessonbooks
      KEYCLOAK_BACKCHANNEL_URL: http://keycloak:8080
      KEYCLOAK_AUDIENCE: lessonbooks-api
      KEYCLOAK_CLIENT_ID: lessonbooks-api
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_API_CLIENT_SECRET:-local-only-api-service-secret-0123456789}
      SERVICE_ROLE: api
    networks: [private, local]
    ports: ['127.0.0.1:3001:3001']
    depends_on:
      emulators: { condition: service_healthy }
      garage: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    develop:
      watch:
        - { action: rebuild, path: backend/src }
        - { action: rebuild, path: doc/contracts }
  worker:
    <<: *runtime
    build: { context: ., dockerfile: backend/Dockerfile, target: worker }
    environment:
      <<: *local-env
      SERVICE_ROLE: worker
      REQUIRE_SCAN: 'true'
      OCR_PROVIDER: ${OCR_PROVIDER:-local}
    mem_limit: 1536m
    volumes: [scanner-data:/var/lib/clamav:ro]
    depends_on:
      emulators: { condition: service_healthy }
      garage: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      signatures: { condition: service_completed_successfully }
    develop:
      watch:
        - { action: rebuild, path: backend/src }
        - { action: rebuild, path: doc/contracts }
networks:
  private: { internal: true }
  updates: {}
  local: {}
volumes:
  emulator-data: {}
  scanner-data: {}
  garage-data: {}
  keycloak-db-data: {}
